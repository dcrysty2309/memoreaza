      <div class="brand">
        <a class="brand-link" routerLink="/" aria-label="Memorează — Acasă">

      </div>

      <div class="cols" aria-label="Linkuri">
        <div class="col" [class.is-open]="openColId === 'about'">
          <button
            class="col-trigger"
            type="button"
            (click)="toggleCol('about')"
            [attr.aria-expanded]="openColId === 'about'"
            aria-controls="footer-col-about"
          >
            <span class="col-title">About</span>
            <span class="col-plus" aria-hidden="true"></span>
          </button>
          <div class="col-panel" id="footer-col-about">
            <div class="col-panel-inner">
              <a class="col-link" routerLink="/despre-noi">Despre Noi</a>
              <a class="col-link" routerLink="/functionalitati">Funcționalități</a>
            </div>
          </div>
        </div>

        <div class="col" [class.is-open]="openColId === 'resources'">
          <button
            class="col-trigger"
            type="button"
            (click)="toggleCol('resources')"
            [attr.aria-expanded]="openColId === 'resources'"
            aria-controls="footer-col-resources"
          >
            <span class="col-title">Resources</span>
            <span class="col-plus" aria-hidden="true"></span>
          </button>
          <div class="col-panel" id="footer-col-resources">
            <div class="col-panel-inner">
              <a class="col-link" routerLink="/blog">Blog</a>
              <a class="col-link" routerLink="/centru-de-ajutor">Centru de Ajutor</a>
            </div>
          </div>
        </div>

        <div class="col" [class.is-open]="openColId === 'company'">
          <button
            class="col-trigger"
            type="button"
            (click)="toggleCol('company')"
            [attr.aria-expanded]="openColId === 'company'"
            aria-controls="footer-col-company"
          >
            <span class="col-title">Company</span>
            <span class="col-plus" aria-hidden="true"></span>
          </button>
          <div class="col-panel" id="footer-col-company">
            <div class="col-panel-inner">
              <a class="col-link" routerLink="/termeni-si-conditii">Termeni și Condiții</a>
              <a class="col-link" routerLink="/politica-de-confidentialitate">Politica de Confidențialitate</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </app-container>

  <div class="bottom">
    <app-container>
      <p class="bottom-copy">© {{ year }} Memorează. Toate drepturile rezervate.</p>
    </app-container>
  </div>
</footer>
