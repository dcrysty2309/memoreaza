<section class="section blog-page">
  <app-container>
    <div class="head">
      <h1 class="title">Blog</h1>
      <p class="subtitle">Articole scurte, practice, pentru învățare eficientă.</p>
      <a class="back" routerLink="/">Înapoi acasă</a>
    </div>

    <div class="grid" aria-label="Articole">
      @for (post of posts; track post.title) {
        <article class="card">
          <div
            class="thumb"
            [style.background-image]="'url(' + post.thumbSrc + ')'"
            role="img"
            [attr.aria-label]="post.thumbAlt"
          ></div>
          <div class="body">
            <h2 class="card-title">{{ post.title }}</h2>
            <p class="card-excerpt">{{ post.excerptShort }}</p>
          </div>
        </article>
      }
    </div>
  </app-container>
</section>
